<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1621" media="(prefers-color-scheme: dark)">
<meta name="description" content="Roteiro dia a dia de 7 dias em Buenos Aires.">
<title>Roteiro Buenos Aires</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Chivo:wght@300..800&family=Chivo+Mono:wght@400..600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="mast" id="mast" data-photo>
    <div class="wrap">
      <p class="eyebrow">06 → 12 dez 2026 · 7 dias · Hotel Pleno Madero</p>
      <h1>Buenos Aires</h1>
      <p class="status" id="status">Roteiro dia a dia</p>
    </div>
  </header>

  <main>
    <section id="view-roteiro" aria-label="Roteiro">
      <div class="days-band"><nav class="wrap days" id="days" aria-label="Dias da viagem"></nav></div>
      <div class="wrap" id="day"></div>
    </section>
    <section id="view-comer" aria-label="Onde comer" hidden><div class="wrap" id="comer"></div></section>
    <section id="view-antes" aria-label="Antes de ir" hidden><div class="wrap" id="antes"></div></section>
  </main>
</div>

<nav class="tabs" aria-label="Seções">
  <div class="wrap">
    <a href="#dia-06" id="tab-roteiro">Roteiro</a>
    <a href="#comer" id="tab-comer">Comer</a>
    <a href="#antes" id="tab-antes">Antes de ir</a>
  </div>
</nav>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
